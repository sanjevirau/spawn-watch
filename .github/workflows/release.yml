name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build universal .app  (arm64 + x86_64)
        run: ./Scripts/build-app.sh release --universal

      - name: Verify universal binary
        run: |
          ARCHS=$(lipo -archs build/SpawnWatch.app/Contents/MacOS/SpawnWatch)
          echo "Built architectures: $ARCHS"
          echo "$ARCHS" | grep -q arm64 || { echo "missing arm64"; exit 1; }
          echo "$ARCHS" | grep -q x86_64 || { echo "missing x86_64"; exit 1; }

      - name: Zip .app
        working-directory: build
        run: |
          ditto -c -k --keepParent SpawnWatch.app SpawnWatch.zip
          shasum -a 256 SpawnWatch.zip | tee SpawnWatch.zip.sha256

      - name: Generate release notes
        id: notes
        run: |
          {
            echo "notes<<EOF"
            echo "## SpawnWatch ${{ github.ref_name }}"
            echo ""
            echo "App-attributed subprocess tracer for macOS."
            echo ""
            echo "### Install"
            echo ""
            echo '1. Download `SpawnWatch.zip` below'
            echo "2. Unzip and drag \`SpawnWatch.app\` to /Applications"
            echo "3. **First launch** (unsigned app): right-click → Open, *or* run \`xattr -dr com.apple.quarantine /Applications/SpawnWatch.app\`"
            echo ""
            echo "### Verify"
            echo ""
            echo '```'
            cat build/SpawnWatch.zip.sha256
            echo '```'
            echo ""
            echo "### Requirements"
            echo ""
            echo "- macOS 14 (Sonoma) or later"
            echo "- Universal binary — runs natively on Apple Silicon (M-series) and Intel"
            echo "- Real-time monitoring needs admin auth on first launch (uses Apple's \`eslogger\`)"
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SpawnWatch ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: true
          files: |
            build/SpawnWatch.zip
            build/SpawnWatch.zip.sha256
          fail_on_unmatched_files: true
